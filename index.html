<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Separação - Batavo</title>
  <style>
    :root {
      --blue: #1a73e8;
      --green: #1e8e3e;
      --green-light: #e6f4ea;
      --red: #d93025;
      --red-light: #fce8e6;
      --amber: #f29900;
      --amber-light: #fef7e0;
      --gray-50: #f8f9fa;
      --gray-100: #f1f3f4;
      --gray-200: #e8eaed;
      --gray-400: #9aa0a6;
      --gray-600: #5f6368;
      --gray-900: #202124;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 2px 8px rgba(0,0,0,0.10);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4ff;
      color: var(--gray-900);
      font-size: 15px;
      min-height: 100vh;
    }

    /* ── TOP BAR ── */
    .topbar {
      background: var(--blue);
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .topbar img { height: 36px; width: 36px; border-radius: 8px; object-fit: cover; }
    .topbar-info { flex: 1; }
    .topbar-info h1 { font-size: 17px; font-weight: 700; }
    .topbar-info p { font-size: 12px; opacity: 0.8; margin-top: 1px; }
    .topbar-btn {
      background: rgba(255,255,255,0.18);
      border: none;
      color: white;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .topbar-btn:active { background: rgba(255,255,255,0.3); }

    /* ── LOGIN ── */
    #loginScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      background: white;
    }
    #loginScreen img { height: 80px; border-radius: 14px; margin-bottom: 20px; }
    #loginScreen h2 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    #loginScreen p { color: var(--gray-600); margin-bottom: 28px; font-size: 14px; }
    .login-box { width: 100%; max-width: 360px; }
    .login-box input {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-size: 15px;
      margin-bottom: 10px;
      background: var(--gray-50);
      color: var(--gray-900);
    }
    .login-box input:focus { outline: none; border-color: var(--blue); background: white; }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn-login:active { opacity: 0.85; }
    .login-error { color: var(--red); font-size: 13px; text-align: center; margin-top: 8px; display: none; }

    /* ── MAIN APP ── */
    #app { display: none; }

    /* ── DATE BAR ── */
    .date-bar {
      background: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--gray-200);
    }
    .date-bar input[type=date] {
      flex: 1;
      padding: 10px 12px;
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-size: 15px;
      background: var(--gray-50);
      color: var(--gray-900);
    }
    .date-bar input:focus { outline: none; border-color: var(--blue); }
    .btn-refresh {
      padding: 10px 14px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-refresh:active { opacity: 0.85; }

    /* ── SUMMARY BAR ── */
    .summary-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--gray-200);
      border-bottom: 1px solid var(--gray-200);
    }
    .summary-item {
      background: white;
      padding: 10px 8px;
      text-align: center;
    }
    .summary-item .val { font-size: 20px; font-weight: 800; color: var(--blue); }
    .summary-item .lbl { font-size: 11px; color: var(--gray-600); margin-top: 1px; }

    /* ── TABS ── */
    .tabs {
      display: flex;
      background: white;
      border-bottom: 2px solid var(--gray-200);
      position: sticky;
      top: 65px;
      z-index: 90;
    }
    .tab {
      flex: 1;
      padding: 12px 8px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-600);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .tab.active { color: var(--blue); border-bottom-color: var(--blue); }

    /* ── CONTENT ── */
    .content { padding: 12px; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── PEDIDO CARD ── */
    .pedido-card {
      background: white;
      border-radius: var(--radius);
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
      border-left: 5px solid var(--gray-200);
      transition: border-color 0.2s;
    }
    .pedido-card.status-pendente { border-left-color: var(--amber); }
    .pedido-card.status-separando { border-left-color: var(--blue); }
    .pedido-card.status-pronto { border-left-color: var(--green); }
    .pedido-card.status-entregue { border-left-color: var(--gray-400); opacity: 0.7; }

    .pedido-header {
      padding: 14px 14px 10px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .pedido-num {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--blue);
      color: white;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .pedido-info { flex: 1; min-width: 0; }
    .pedido-cliente { font-size: 16px; font-weight: 700; }
    .pedido-meta { font-size: 12px; color: var(--gray-600); margin-top: 2px; }
    .pedido-valor { font-size: 17px; font-weight: 800; color: var(--green); white-space: nowrap; }

    .pedido-status-row {
      padding: 0 14px 12px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .status-btn {
      padding: 6px 12px;
      border-radius: 20px;
      border: 2px solid var(--gray-200);
      background: white;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .status-btn.pendente.active   { background: var(--amber-light); border-color: var(--amber); color: #7a5200; }
    .status-btn.separando.active  { background: var(--blue-light, #e8f0fe); border-color: var(--blue); color: var(--blue); }
    .status-btn.pronto.active     { background: var(--green-light); border-color: var(--green); color: var(--green); }
    .status-btn.entregue.active   { background: var(--gray-100); border-color: var(--gray-400); color: var(--gray-600); }

    /* ── ITENS DO PEDIDO ── */
    .pedido-itens {
      display: none;
      border-top: 1px solid var(--gray-100);
    }
    .pedido-itens.open { display: block; }
    .item-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border-bottom: 1px solid var(--gray-50);
    }
    .item-row:last-child { border-bottom: none; }
    .item-check {
      width: 26px; height: 26px;
      border-radius: 6px;
      border: 2px solid var(--gray-200);
      background: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .item-check.checked { background: var(--green); border-color: var(--green); color: white; }
    .item-info { flex: 1; min-width: 0; }
    .item-nome { font-size: 14px; font-weight: 600; }
    .item-nome.checked { text-decoration: line-through; color: var(--gray-400); }
    .item-qtd { font-size: 12px; color: var(--gray-600); margin-top: 2px; }
    .item-preco { font-size: 14px; font-weight: 700; color: var(--blue); white-space: nowrap; }

    .pedido-obs {
      padding: 10px 14px;
      background: var(--amber-light);
      font-size: 13px;
      color: #7a5200;
      border-top: 1px solid var(--amber);
      display: flex;
      gap: 6px;
      align-items: flex-start;
    }

    /* ── LISTA CONSOLIDADA ── */
    .lista-card {
      background: white;
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .lista-check {
      width: 30px; height: 30px;
      border-radius: 8px;
      border: 2px solid var(--gray-200);
      background: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .lista-check.checked { background: var(--green); border-color: var(--green); color: white; }
    .lista-info { flex: 1; }
    .lista-nome { font-size: 15px; font-weight: 700; }
    .lista-nome.checked { text-decoration: line-through; color: var(--gray-400); }
    .lista-det { font-size: 12px; color: var(--gray-600); margin-top: 3px; }
    .lista-qtd {
      font-size: 22px;
      font-weight: 800;
      color: var(--blue);
      white-space: nowrap;
    }

    /* ── EMPTY ── */
    .empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--gray-400);
    }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty p { font-size: 15px; }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--gray-900);
      color: white;
      padding: 10px 22px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      opacity: 0;
      transition: all 0.25s;
      z-index: 500;
      white-space: nowrap;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── LOADING ── */
    .loading {
      text-align: center;
      padding: 40px 20px;
      color: var(--gray-600);
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--gray-200);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .blue-light { background: #e8f0fe; }
  </style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- LOGIN -->
<div id="loginScreen">
  <img src="https://i.postimg.cc/7Pgm8YqM/Whats-App-Image-2026-06-14-at-10-32-57.jpg" alt="Batavo">
  <h2>Batavo — Separação</h2>
  <p>Acesso para funcionários</p>
  <div class="login-box">
    <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
    <input type="password" id="loginPassword" placeholder="Senha" autocomplete="current-password">
    <button class="btn-login" id="loginBtn">Entrar</button>
    <div class="login-error" id="loginError">Email ou senha incorretos.</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <img src="https://i.postimg.cc/7Pgm8YqM/Whats-App-Image-2026-06-14-at-10-32-57.jpg" alt="Batavo">
    <div class="topbar-info">
      <h1>Separação de Pedidos</h1>
      <p id="topbarDate">Hoje</p>
    </div>
    <button class="topbar-btn" id="logoutBtn">Sair</button>
  </div>

  <!-- Data + Atualizar -->
  <div class="date-bar">
    <input type="date" id="filterDate">
    <button class="btn-refresh" onclick="loadSales()">🔄 Atualizar</button>
  </div>

  <!-- Resumo -->
  <div class="summary-bar">
    <div class="summary-item">
      <div class="val" id="sumPedidos">0</div>
      <div class="lbl">Pedidos</div>
    </div>
    <div class="summary-item">
      <div class="val" id="sumItens">0</div>
      <div class="lbl">Itens</div>
    </div>
    <div class="summary-item">
      <div class="val" id="sumProntos">0</div>
      <div class="lbl">✅ Prontos</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" onclick="showTab('pedidos')">📋 Pedidos</div>
    <div class="tab" onclick="showTab('lista')">📦 Lista Geral</div>
  </div>

  <div class="content">
    <!-- TAB: PEDIDOS -->
    <div class="tab-panel active" id="tab-pedidos">
      <div id="pedidosList">
        <div class="loading"><div class="spinner"></div><p>Carregando...</p></div>
      </div>
    </div>

    <!-- TAB: LISTA GERAL -->
    <div class="tab-panel" id="tab-lista">
      <div id="listaGeral">
        <div class="loading"><div class="spinner"></div><p>Carregando...</p></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDJBdK9I-jtg9ujTc9Xsxr-hnPfkId4wIU",
    authDomain: "pdv1-77632.firebaseapp.com",
    databaseURL: "https://pdv1-77632-default-rtdb.firebaseio.com",
    projectId: "pdv1-77632",
    storageBucket: "pdv1-77632.firebasestorage.app",
    messagingSenderId: "246033791117",
    appId: "1:246033791117:web:7b70b511ea8d8c5ba1cac4"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth();
  const db = getDatabase();

  let allSales = [];
  let checkedItems = {}; // { saleId: { itemIdx: true } }
  let checkedLista = {}; // { nomeProduto: true }
  let pedidoStatuses = {}; // { saleId: 'pendente'|'separando'|'pronto'|'entregue' }
  let expandedCards = {}; // { saleId: true }
  let currentUid = null;
  let activeTab = 'pedidos';

  // ── UTILS ──
  function toast(msg, dur = 2500) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), dur);
  }

  function fmt(n) { return 'R$ ' + Number(n).toFixed(2).replace('.', ','); }

  function fmtQtd(item) {
    if (!item) return '';
    return item.unidade === 'kilo'
      ? (item.quantidade * 1000).toFixed(0) + 'g'
      : item.quantidade + ' un';
  }

  // ── AUTH ──
  document.getElementById('loginBtn').onclick = () => {
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPassword').value;
    document.getElementById('loginError').style.display = 'none';
    signInWithEmailAndPassword(auth, email, pass)
      .catch(() => {
        document.getElementById('loginError').style.display = 'block';
      });
  };

  document.getElementById('logoutBtn').onclick = () => signOut(auth);

  onAuthStateChanged(auth, user => {
    if (user) {
      currentUid = user.uid;
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('filterDate').value = today;
      document.getElementById('topbarDate').textContent = formatDateDisplay(today);
      loadSales();
    } else {
      currentUid = null;
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('app').style.display = 'none';
    }
  });

  function formatDateDisplay(dateStr) {
    const d = new Date(dateStr + 'T12:00:00');
    return d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
  }

  // ── LOAD SALES ──
  window.loadSales = () => {
    if (!currentUid) return;
    const date = document.getElementById('filterDate').value;
    document.getElementById('topbarDate').textContent = formatDateDisplay(date);
    document.getElementById('pedidosList').innerHTML = '<div class="loading"><div class="spinner"></div><p>Carregando...</p></div>';
    document.getElementById('listaGeral').innerHTML = '<div class="loading"><div class="spinner"></div><p>Carregando...</p></div>';

    onValue(ref(db, `vendas/${currentUid}`), snap => {
      const all = snap.exists() ? Object.entries(snap.val()).map(([k, v]) => ({ id: k, ...v })) : [];
      const start = new Date(date + 'T00:00:00');
      const end = new Date(date + 'T23:59:59');
      allSales = all.filter(s => {
        const d = new Date(s.dataVenda);
        return d >= start && d <= end && s.items && s.items.length > 0;
      }).sort((a, b) => new Date(a.dataVenda) - new Date(b.dataVenda));

      // Load statuses from Firebase
      onValue(ref(db, `separacao/${currentUid}/${date}`), snapStatus => {
        pedidoStatuses = snapStatus.exists() ? snapStatus.val() : {};
        renderAll();
      }, { onlyOnce: true });
    }, { onlyOnce: true });
  };

  function renderAll() {
    renderSummary();
    renderPedidos();
    renderLista();
  }

  // ── SUMMARY ──
  function renderSummary() {
    const totalItens = allSales.reduce((s, v) => s + (v.items?.length || 0), 0);
    const prontos = allSales.filter(s => pedidoStatuses[s.id] === 'pronto' || pedidoStatuses[s.id] === 'entregue').length;
    document.getElementById('sumPedidos').textContent = allSales.length;
    document.getElementById('sumItens').textContent = totalItens;
    document.getElementById('sumProntos').textContent = prontos;
  }

  // ── TAB NAVIGATION ──
  window.showTab = (tab) => {
    activeTab = tab;
    document.querySelectorAll('.tab').forEach((t, i) => {
      t.classList.toggle('active', ['pedidos','lista'][i] === tab);
    });
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
  };

  // ── RENDER PEDIDOS ──
  function renderPedidos() {
    const div = document.getElementById('pedidosList');
    if (!allSales.length) {
      div.innerHTML = `<div class="empty"><div class="empty-icon">📋</div><p>Nenhum pedido com itens para este dia.</p></div>`;
      return;
    }
    div.innerHTML = allSales.map((sale, idx) => {
      const status = pedidoStatuses[sale.id] || 'pendente';
      const isOpen = expandedCards[sale.id] || false;
      const hora = new Date(sale.dataVenda).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      const payIcon = { Pix:'💠', Dinheiro:'💵', Credito:'💳', Debito:'💳', Outro:'🔹' }[sale.tipoPagamento] || '🔹';
      const checked = checkedItems[sale.id] || {};
      const totalChecked = Object.values(checked).filter(Boolean).length;
      const totalItens = sale.items.length;

      return `
        <div class="pedido-card status-${status}" id="card-${sale.id}">
          <div class="pedido-header" onclick="toggleCard('${sale.id}')">
            <div class="pedido-num">${idx + 1}</div>
            <div class="pedido-info">
              <div class="pedido-cliente">${sale.clienteNome || 'Sem Cliente'}</div>
              <div class="pedido-meta">
                🕐 ${hora} &nbsp;|&nbsp; ${payIcon} ${sale.tipoPagamento}
                &nbsp;|&nbsp; ${totalChecked}/${totalItens} itens
              </div>
            </div>
            <div style="text-align:right;">
              <div class="pedido-valor">${fmt(sale.valorTotal)}</div>
              <div style="font-size:20px;color:var(--gray-400);margin-top:2px;">${isOpen ? '▲' : '▼'}</div>
            </div>
          </div>

          <div class="pedido-status-row">
            ${['pendente','separando','pronto','entregue'].map(s => `
              <button class="status-btn ${s} ${status === s ? 'active' : ''}"
                onclick="setStatus('${sale.id}', '${s}')">
                ${{ pendente:'⏳ Pendente', separando:'🔄 Separando', pronto:'✅ Pronto', entregue:'🚚 Entregue' }[s]}
              </button>
            `).join('')}
          </div>

          <div class="pedido-itens ${isOpen ? 'open' : ''}" id="itens-${sale.id}">
            ${sale.items.map((item, iIdx) => {
              const isChecked = checked[iIdx] || false;
              return `
                <div class="item-row">
                  <div class="item-check ${isChecked ? 'checked' : ''}"
                    onclick="toggleItemCheck('${sale.id}', ${iIdx})">
                    ${isChecked ? '✓' : ''}
                  </div>
                  <div class="item-info">
                    <div class="item-nome ${isChecked ? 'checked' : ''}">${item.nome}</div>
                    <div class="item-qtd">${fmtQtd(item)}</div>
                  </div>
                  <div class="item-preco">${fmt(item.preco)}</div>
                </div>`;
            }).join('')}
            ${sale.observacoes && sale.observacoes !== 'Venda PDV' ? `
              <div class="pedido-obs">💬 <span>${sale.observacoes}</span></div>
            ` : ''}
          </div>
        </div>`;
    }).join('');
  }

  // ── TOGGLE CARD ──
  window.toggleCard = (id) => {
    expandedCards[id] = !expandedCards[id];
    const itens = document.getElementById(`itens-${id}`);
    const header = itens?.previousElementSibling?.previousElementSibling;
    if (itens) itens.classList.toggle('open', expandedCards[id]);
    // update arrow
    const arrow = document.querySelector(`#card-${id} .pedido-header > div:last-child > div:last-child`);
    if (arrow) arrow.textContent = expandedCards[id] ? '▲' : '▼';
  };

  // ── STATUS ──
  window.setStatus = (saleId, status) => {
    pedidoStatuses[saleId] = status;
    const date = document.getElementById('filterDate').value;
    const updates = {};
    updates[`separacao/${currentUid}/${date}/${saleId}`] = status;
    update(ref(db), updates).then(() => {
      const labels = { pendente:'⏳ Pendente', separando:'🔄 Separando', pronto:'✅ Pronto!', entregue:'🚚 Entregue!' };
      toast(labels[status]);
    });
    // Update card border and buttons
    const card = document.getElementById(`card-${saleId}`);
    if (card) {
      card.className = `pedido-card status-${status}`;
      card.querySelectorAll('.status-btn').forEach(btn => {
        btn.classList.toggle('active', btn.classList.contains(status));
      });
    }
    renderSummary();
  };

  // ── CHECK ITEM ──
  window.toggleItemCheck = (saleId, itemIdx) => {
    if (!checkedItems[saleId]) checkedItems[saleId] = {};
    checkedItems[saleId][itemIdx] = !checkedItems[saleId][itemIdx];
    const isChecked = checkedItems[saleId][itemIdx];
    // Update visuals inline
    const rows = document.querySelectorAll(`#itens-${saleId} .item-row`);
    const row = rows[itemIdx];
    if (row) {
      const chk = row.querySelector('.item-check');
      const nome = row.querySelector('.item-nome');
      if (chk) { chk.classList.toggle('checked', isChecked); chk.textContent = isChecked ? '✓' : ''; }
      if (nome) nome.classList.toggle('checked', isChecked);
    }
    // Update counter in header
    const sale = allSales.find(s => s.id === saleId);
    if (sale) {
      const totalChecked = Object.values(checkedItems[saleId]).filter(Boolean).length;
      const meta = document.querySelector(`#card-${saleId} .pedido-meta`);
      if (meta) {
        const hora = new Date(sale.dataVenda).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        const payIcon = { Pix:'💠', Dinheiro:'💵', Credito:'💳', Debito:'💳', Outro:'🔹' }[sale.tipoPagamento] || '🔹';
        meta.innerHTML = `🕐 ${hora} &nbsp;|&nbsp; ${payIcon} ${sale.tipoPagamento} &nbsp;|&nbsp; ${totalChecked}/${sale.items.length} itens`;
      }
    }
    // Auto-mark as separando when first item checked
    const sale2 = allSales.find(s => s.id === saleId);
    if (isChecked && sale2 && (!pedidoStatuses[saleId] || pedidoStatuses[saleId] === 'pendente')) {
      setStatus(saleId, 'separando');
    }
  };

  // ── RENDER LISTA GERAL ──
  function renderLista() {
    const div = document.getElementById('listaGeral');
    if (!allSales.length) {
      div.innerHTML = `<div class="empty"><div class="empty-icon">📦</div><p>Nenhum item para este dia.</p></div>`;
      return;
    }
    // Consolida todos os itens
    const consolidated = {};
    allSales.forEach(sale => {
      (sale.items || []).forEach(item => {
        const key = item.nome.trim().toLowerCase();
        if (!consolidated[key]) {
          consolidated[key] = {
            nome: item.nome,
            unidade: item.unidade,
            totalQtd: 0,
            totalQtdRaw: 0,
            pedidos: []
          };
        }
        consolidated[key].totalQtdRaw += item.quantidade;
        consolidated[key].pedidos.push({
          cliente: sale.clienteNome || 'Sem Cliente',
          qtd: fmtQtd(item),
          preco: item.preco
        });
      });
    });

    const entries = Object.values(consolidated).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));

    div.innerHTML = entries.map(p => {
      const isChecked = checkedLista[p.nome] || false;
      const qtdDisplay = p.unidade === 'kilo'
        ? (p.totalQtdRaw * 1000).toFixed(0) + 'g'
        : p.totalQtdRaw % 1 === 0 ? p.totalQtdRaw + ' un' : p.totalQtdRaw.toFixed(3) + ' un';
      const pedidosText = p.pedidos.map(pd => `${pd.cliente} (${pd.qtd})`).join(' · ');

      return `
        <div class="lista-card">
          <div class="lista-check ${isChecked ? 'checked' : ''}"
            onclick="toggleListaCheck('${p.nome}')">
            ${isChecked ? '✓' : ''}
          </div>
          <div class="lista-info">
            <div class="lista-nome ${isChecked ? 'checked' : ''}">${p.nome}</div>
            <div class="lista-det">${pedidosText}</div>
          </div>
          <div class="lista-qtd">${qtdDisplay}</div>
        </div>`;
    }).join('');
  }

  window.toggleListaCheck = (nome) => {
    checkedLista[nome] = !checkedLista[nome];
    renderLista();
  };

  // Atualiza ao mudar data
  document.getElementById('filterDate').onchange = () => {
    checkedItems = {};
    checkedLista = {};
    expandedCards = {};
    loadSales();
  };
</script>
</body>
</html>
